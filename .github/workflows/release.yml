name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag to verify and package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install build and coverage toolchain
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --requirement requirements-build.lock
      - name: Verify release identity
        run: >-
          python tools/release_check.py
          --tag "${RELEASE_TAG}"
          --require-annotated-tag
          --pretty
      - name: Run complete validation
        run: |
          make check
          make coverage
          make history-scan
      - name: Build release archives
        run: python -m build --no-isolation --outdir dist .
      - name: Verify archive names and record digests
        run: >-
          python tools/release_check.py
          --tag "${RELEASE_TAG}"
          --require-annotated-tag
          --dist dist
          --pretty
      - name: Upload verified archives
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aidlc-v2-engine-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
